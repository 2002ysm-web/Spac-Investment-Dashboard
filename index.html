<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPAC 투자 판단 대시보드</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --pos: #22c55e;
      --neg: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .meta { font-size: 0.85rem; color: var(--muted); }
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--card);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    select, input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .table-wrap {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.92rem;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-weight: 600;
    }
    td:first-child, th:first-child { text-align: left; padding-left: 16px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .badge-o { background: rgba(34, 197, 94, 0.2); color: var(--pos); }
    .badge-x { background: rgba(239, 68, 68, 0.2); color: var(--neg); }
    .badge-merger { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .badge-liq { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .pos { color: var(--pos); font-weight: 600; }
    .neg { color: var(--neg); font-weight: 600; }
    .sub-rate { font-size: 0.78rem; color: var(--muted); display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>SPAC 투자 판단 대시보드</h1>
        <p class="meta">KRX 코스닥 SPAC 전종목 · DART 공시 연동 기준</p>
      </div>
      <div class="meta" id="updatedAt">업데이트: 불러오는 중...</div>
    </header>

    <!-- 7. 필터: 매수적정가(O/X), 투자유형(합병/청산), 예상수익률(+/-) -->
    <div class="filters">
      <div class="filter-group">
        <label for="filterFair">매수적정가:</label>
        <select id="filterFair">
          <option value="ALL">전체</option>
          <option value="O">O (적정가 이하)</option>
          <option value="X">X (고평가)</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterType">투자유형:</label>
        <select id="filterType">
          <option value="ALL">전체</option>
          <option value="합병">합병 (잔여 1년 이상)</option>
          <option value="청산">청산 (잔여 1년 미만)</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filterYield">예상수익률:</label>
        <select id="filterYield">
          <option value="ALL">전체</option>
          <option value="POS">+ (플러스 수익)</option>
          <option value="NEG">- (마이너스 수익)</option>
        </select>
      </div>
      <div class="filter-group">
        <input type="text" id="searchName" placeholder="종목명 검색..." />
      </div>
    </div>

    <!-- 6. 테이블 범례: 종목명, 매수적정가(O/X), 투자유형(합병/청산), 상장폐지일, 현재가, 최종청산단가, 예상수익률(일반/ISA) -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>종목명</th>
            <th>매수적정가</th>
            <th>투자유형</th>
            <th>상장폐지일</th>
            <th>현재가</th>
            <th>최종청산단가</th>
            <th>예상수익률 (일반 / ISA)</th>
          </tr>
        </thead>
        <tbody id="spacTableBody">
          <tr><td colspan="7">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allItems = [];

    async function loadData() {
      try {
        const res = await fetch('./data/spacs.json?t=' + Date.now());
        const data = await res.json();
        allItems = data.items || [];
        document.getElementById('updatedAt').textContent = `최근 업데이트: ${data.updated_at} (총 ${allItems.length}종목)`;
        renderTable();
      } catch (e) {
        document.getElementById('spacTableBody').innerHTML =
          '<tr><td colspan="7">데이터(data/spacs.json)를 불러오지 못했습니다. 워크플로를 먼저 실행해 주세요.</td></tr>';
      }
    }

    function renderTable() {
      const fairFilter = document.getElementById('filterFair').value;
      const typeFilter = document.getElementById('filterType').value;
      const yieldFilter = document.getElementById('filterYield').value;
      const keyword = document.getElementById('searchName').value.trim().toLowerCase();

      const filtered = allItems.filter(item => {
        if (fairFilter !== 'ALL' && item.is_fair_buy !== fairFilter) return false;
        if (typeFilter !== 'ALL' && item.invest_type !== typeFilter) return false;
        if (yieldFilter === 'POS' && item.yield_isa <= 0) return false;
        if (yieldFilter === 'NEG' && item.yield_isa > 0) return false;
        if (keyword && !item.name.toLowerCase().includes(keyword)) return false;
        return true;
      });

      const tbody = document.getElementById('spacTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">조건에 맞는 스팩 종목이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const fairBadge = item.is_fair_buy === 'O'
          ? '<span class="badge badge-o">O</span>'
          : '<span class="badge badge-x">X</span>';

        const typeBadge = item.invest_type === '합병'
          ? '<span class="badge badge-merger">합병</span>'
          : '<span class="badge badge-liq">청산</span>';

        const genClass = item.yield_general >= 0 ? 'pos' : 'neg';
        const isaClass = item.yield_isa >= 0 ? 'pos' : 'neg';

        return `
          <tr>
            <td>
              <strong>${item.name}</strong>
              <span class="sub-rate">공시 예치금리 ${item.deposit_rate}% · ${item.status}</span>
            </td>
            <td>${fairBadge}</td>
            <td>${typeBadge}</td>
            <td>${item.delisting_date}</td>
            <td>${item.current_price.toLocaleString()}원</td>
            <td>${item.liquidation_price.toLocaleString()}원</td>
            <td>
              <span class="${genClass}">일반 ${item.yield_general.toFixed(2)}%</span> /
              <span class="${isaClass}">ISA ${item.yield_isa.toFixed(2)}%</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    ['filterFair', 'filterType', 'filterYield'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderTable);
    });
    document.getElementById('searchName').addEventListener('input', renderTable);

    loadData();
  </script>
</body>
</html>
