<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAC Investment Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div class="max-w-7xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-200 pb-6">
            <div>
                <div class="flex items-center gap-3 flex-wrap">
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">🚀 SPAC Investment Dashboard</h1>
                    <!-- 기준 예금금리 표시 뱃지 -->
                    <span id="deposit-rate-badge" class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                        기준 예금금리: 연 --%
                    </span>
                </div>
                <p class="text-sm text-slate-500 mt-1">KRX, 네이버 금융 및 DART 공시 데이터를 기반으로 실시간 자동 갱신됩니다.</p>
            </div>
            <div id="update-time" class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 text-xs font-semibold text-slate-600">
                데이터 로딩 중...
            </div>
        </div>

        <!-- Recommendations Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- 합병형 추천 카드 -->
            <div class="bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-900 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden border border-indigo-500/20">
                <div class="absolute top-4 right-4 bg-indigo-500/30 text-indigo-200 text-xs px-3 py-1 rounded-full font-semibold">합병형 TOP 추천</div>
                <p class="text-xs uppercase tracking-wider text-indigo-300 font-bold mb-1">MERGER TYPE BEST</p>
                <h2 id="rec-merger-name" class="text-2xl font-bold mb-4 tracking-tight">-</h2>
                <div class="grid grid-cols-3 gap-3 text-sm bg-white/5 p-4 rounded-xl border border-white/10 backdrop-blur-sm">
                    <div>
                        <p class="text-xs text-indigo-300 font-medium">현재가</p>
                        <p id="rec-merger-price" class="font-bold text-base mt-0.5">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-indigo-300 font-medium">예상수익률(ISA)</p>
                        <p id="rec-merger-yield" class="font-bold text-emerald-400 text-base mt-0.5">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-indigo-300 font-medium">청산단가</p>
                        <p id="rec-merger-liq" class="font-bold text-base mt-0.5">-</p>
                    </div>
                </div>
            </div>

            <!-- 청산형 추천 카드 -->
            <div class="bg-gradient-to-br from-blue-900 via-slate-900 to-slate-900 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden border border-blue-500/20">
                <div class="absolute top-4 right-4 bg-blue-500/30 text-blue-200 text-xs px-3 py-1 rounded-full font-semibold">청산형 TOP 추천</div>
                <p class="text-xs uppercase tracking-wider text-blue-300 font-bold mb-1">LIQUIDATION TYPE BEST</p>
                <h2 id="rec-liq-name" class="text-2xl font-bold mb-4 tracking-tight">-</h2>
                <div class="grid grid-cols-3 gap-3 text-sm bg-white/5 p-4 rounded-xl border border-white/10 backdrop-blur-sm">
                    <div>
                        <p class="text-xs text-blue-300 font-medium">현재가</p>
                        <p id="rec-liq-price" class="font-bold text-base mt-0.5">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-blue-300 font-medium">예상수익률(ISA)</p>
                        <p id="rec-liq-yield" class="font-bold text-emerald-400 text-base mt-0.5">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-blue-300 font-medium">청산단가</p>
                        <p id="rec-liq-liq" class="font-bold text-base mt-0.5">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters & Search Bar -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 items-center">
            <!-- 1. 투자유형 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">투자유형</label>
                <select id="filter-type" onchange="applyFilters()" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700">
                    <option value="all">전체</option>
                    <option value="합병">합병</option>
                    <option value="청산">청산</option>
                </select>
            </div>
            <!-- 2. 매수적정 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">매수적정</label>
                <select id="filter-fair" onchange="applyFilters()" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700">
                    <option value="all">전체</option>
                    <option value="O">O</option>
                    <option value="X">X</option>
                </select>
            </div>
            <!-- 3. 거래상태 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">거래상태</label>
                <select id="filter-status" onchange="applyFilters()" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700">
                    <option value="all">전체</option>
                    <option value="정상" selected>정상</option>
                    <option value="거래정지">정지</option>
                </select>
            </div>
            <!-- 4. 투자계좌 (ISA / 일반) -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">투자계좌</label>
                <select id="filter-account" onchange="applyFilters()" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700">
                    <option value="isa" selected>ISA</option>
                    <option value="general">일반계좌</option>
                </select>
            </div>
            <!-- 5. 예상수익률 구간 필터 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">예상수익률</label>
                <select id="filter-yield-range" onchange="applyFilters()" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white font-medium text-slate-700">
                    <option value="all" selected>전체 출력</option>
                    <option value="above_deposit">예금금리 이상</option>
                    <option value="low_positive">0% 이상 ~ 예금금리 미만</option>
                    <option value="negative">마이너스 (&lt;0%)</option>
                </select>
            </div>
            <!-- 종목 검색 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">종목 검색</label>
                <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="종목명 입력..." class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-700">
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="py-4 px-6 font-bold">종목명</th>
                            <th class="py-4 px-6 font-bold">현재가</th>
                            <th class="py-4 px-6 font-bold">청산단가</th>
                            <th class="py-4 px-6 font-bold">매수적정</th>
                            <th class="py-4 px-6 font-bold">투자유형</th>
                            <th class="py-4 px-6 font-bold">예상수익률 (일반)</th>
                            <th class="py-4 px-6 font-bold">예상수익률 (ISA)</th>
                            <th class="py-4 px-6 font-bold">상태</th>
                        </tr>
                    </thead>
                    <tbody id="spac-table-body" class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                        <!-- 동적 삽입 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allItems = [];

        async function loadSpacData() {
            try {
                const response = await fetch('data/spacs.json');
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `최종 갱신: ${data.updated_at}`;
                allItems = data.items;

                // 상단 헤더에 기준 예금금리 표시 (첫 번째 종목의 deposit_rate 활용)
                if (allItems.length > 0 && allItems[0].deposit_rate) {
                    document.getElementById('deposit-rate-badge').innerText = `기준 예금금리: 연 ${allItems[0].deposit_rate}%`;
                }

                updateRecommendations(allItems);
                applyFilters();

            } catch (error) {
                console.error('데이터 로드 에러:', error);
                document.getElementById('update-time').innerText = '데이터 로드 실패';
            }
        }

        function updateRecommendations(items) {
            const validItems = items.filter(i => i.is_fair_buy === 'O' && i.status === '정상');

            const mergerItems = validItems.filter(i => i.invest_type === '합병').sort((a, b) => b.yield_isa - a.yield_isa);
            if (mergerItems.length > 0) {
                const bestM = mergerItems[0];
                document.getElementById('rec-merger-name').innerText = bestM.name;
                document.getElementById('rec-merger-price').innerText = bestM.current_price.toLocaleString() + '원';
                document.getElementById('rec-merger-yield').innerText = bestM.yield_isa + '%';
                document.getElementById('rec-merger-liq').innerText = bestM.liquidation_price.toLocaleString() + '원';
            } else {
                document.getElementById('rec-merger-name').innerText = '조건 만족 종목 없음';
            }

            const liqItems = validItems.filter(i => i.invest_type === '청산').sort((a, b) => b.yield_isa - a.yield_isa);
            if (liqItems.length > 0) {
                const bestL = liqItems[0];
                document.getElementById('rec-liq-name').innerText = bestL.name;
                document.getElementById('rec-liq-price').innerText = bestL.current_price.toLocaleString() + '원';
                document.getElementById('rec-liq-yield').innerText = bestL.yield_isa + '%';
                document.getElementById('rec-liq-liq').innerText = bestL.liquidation_price.toLocaleString() + '원';
            } else {
                document.getElementById('rec-liq-name').innerText = '조건 만족 종목 없음';
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('spac-table-body');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-12 text-center text-slate-400 font-normal">조건에 일치하는 종목이 없습니다.</td></tr>`;
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";
                
                tr.innerHTML = `
                    <td class="py-4 px-6 font-bold text-slate-900">${item.name}</td>
                    <td class="py-4 px-6 text-slate-600">${item.current_price > 0 ? item.current_price.toLocaleString() + '원' : '-'}</td>
                    <td class="py-4 px-6 text-slate-600">${item.liquidation_price.toLocaleString()}원</td>
                    <td class="py-4 px-6"><span class="font-bold ${item.is_fair_buy === 'O' ? 'text-indigo-600' : 'text-slate-400'}">${item.is_fair_buy}</span></td>
                    <td class="py-4 px-6"><span class="px-2.5 py-1 text-xs rounded-full font-semibold ${item.invest_type === '합병' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200/50' : 'bg-amber-50 text-amber-700 border border-amber-200/50'}">${item.invest_type}</span></td>
                    <td class="py-4 px-6 text-slate-700">${item.yield_general}%</td>
                    <td class="py-4 px-6 font-bold text-emerald-600">${item.yield_isa}%</td>
                    <td class="py-4 px-6 text-xs"><span class="px-2 py-1 rounded-md ${item.status === '거래정지' ? 'bg-rose-50 text-rose-600 font-bold border border-rose-200' : 'text-slate-500'}">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filter-type').value;
            const fairFilter = document.getElementById('filter-fair').value;
            const statusFilter = document.getElementById('filter-status').value;
            const accountType = document.getElementById('filter-account').value;
            const yieldRange = document.getElementById('filter-yield-range').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            let filtered = allItems.filter(item => {
                if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
                if (typeFilter !== 'all' && item.invest_type !== typeFilter) return false;
                if (fairFilter !== 'all' && item.is_fair_buy !== fairFilter) return false;
                if (statusFilter !== 'all' && item.status !== statusFilter) return false;

                const currentYield = accountType === 'isa' ? item.yield_isa : item.yield_general;
                const depositRate = item.deposit_rate || 3.2;

                if (yieldRange === 'above_deposit' && currentYield < depositRate) return false;
                if (yieldRange === 'low_positive' && (currentYield < 0 || currentYield >= depositRate)) return false;
                if (yieldRange === 'negative' && currentYield >= 0) return false;

                return true;
            });

            filtered.sort((a, b) => {
                const yA = accountType === 'isa' ? a.yield_isa : a.yield_general;
                const yB = accountType === 'isa' ? b.yield_isa : b.yield_general;
                return yB - yA;
            });

            renderTable(filtered);
        }

        loadSpacData();
    </script>
</body>
</html>
