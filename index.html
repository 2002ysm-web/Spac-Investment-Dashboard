<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAC Investment Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">🚀 SPAC Investment Dashboard</h1>
                <p class="text-sm text-gray-500 mt-1">KRX, 네이버 금융 및 DART 공시 데이터를 기반으로 자동 갱신됩니다.</p>
            </div>
            <div id="update-time" class="bg-white px-4 py-2 rounded-lg shadow text-sm font-medium text-gray-600">
                데이터 로딩 중...
            </div>
        </div>

        <!-- Recommendations Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- 합병형 추천 카드 -->
            <div class="bg-gradient-to-br from-purple-900 to-slate-900 text-white p-6 rounded-2xl shadow-md relative overflow-hidden">
                <div class="absolute top-4 right-4 bg-purple-500/30 text-purple-200 text-xs px-3 py-1 rounded-full font-medium">합병형 TOP 추천</div>
                <h3 class="text-xs uppercase tracking-wider text-purple-300 font-semibold mb-1">MERGER TYPE BEST</h3>
                <h2 id="rec-merger-name" class="text-2xl font-bold mb-3">-</h2>
                <div class="grid grid-cols-3 gap-2 text-sm bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                    <div>
                        <p class="text-xs text-purple-300">현재가</p>
                        <p id="rec-merger-price" class="font-bold">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-purple-300">예상수익률(ISA)</p>
                        <p id="rec-merger-yield" class="font-bold text-emerald-400">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-purple-300">청산단가</p>
                        <p id="rec-merger-liq" class="font-bold">-</p>
                    </div>
                </div>
            </div>

            <!-- 청산형 추천 카드 -->
            <div class="bg-gradient-to-br from-blue-900 to-slate-900 text-white p-6 rounded-2xl shadow-md relative overflow-hidden">
                <div class="absolute top-4 right-4 bg-blue-500/30 text-blue-200 text-xs px-3 py-1 rounded-full font-medium">청산형 TOP 추천</div>
                <h3 class="text-xs uppercase tracking-wider text-blue-300 font-semibold mb-1">LIQUIDATION TYPE BEST</h3>
                <h2 id="rec-liq-name" class="text-2xl font-bold mb-3">-</h2>
                <div class="grid grid-cols-3 gap-2 text-sm bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                    <div>
                        <p class="text-xs text-blue-300">현재가</p>
                        <p id="rec-liq-price" class="font-bold">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-blue-300">예상수익률(ISA)</p>
                        <p id="rec-liq-yield" class="font-bold text-emerald-400">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-blue-300">청산단가</p>
                        <p id="rec-liq-liq" class="font-bold">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-center">
            <!-- 1. 투자유형 -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">투자유형</label>
                <select id="filter-type" onchange="applyFilters()" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white">
                    <option value="all">전체</option>
                    <option value="합병">합병</option>
                    <option value="청산">청산</option>
                </select>
            </div>
            <!-- 2. 매수적정 -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">매수적정</label>
                <select id="filter-fair" onchange="applyFilters()" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white">
                    <option value="all">전체</option>
                    <option value="O">O</option>
                    <option value="X">X</option>
                </select>
            </div>
            <!-- 3. 거래상태 -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">거래상태</label>
                <select id="filter-status" onchange="applyFilters()" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white">
                    <option value="all">전체</option>
                    <option value="정상" selected>정상</option>
                    <option value="거래정지">정지</option>
                </select>
            </div>
            <!-- 4. 예상수익률 -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">예상수익률</label>
                <select id="filter-yield-type" onchange="applyFilters()" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white">
                    <option value="all">전체</option>
                    <option value="isa" selected>ISA</option>
                    <option value="general">일반</option>
                </select>
            </div>
            <!-- 검색바 -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">종목 검색</label>
                <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="종목명 입력..." class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500">
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                            <th class="py-3 px-4 font-semibold">종목명</th>
                            <th class="py-3 px-4 font-semibold">현재가</th>
                            <th class="py-3 px-4 font-semibold">청산단가</th>
                            <th class="py-3 px-4 font-semibold">매수적정</th>
                            <th class="py-3 px-4 font-semibold">투자유형</th>
                            <th class="py-3 px-4 font-semibold">예상수익률 (일반)</th>
                            <th class="py-3 px-4 font-semibold">예상수익률 (ISA)</th>
                            <th class="py-3 px-4 font-semibold">상태</th>
                        </tr>
                    </thead>
                    <tbody id="spac-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- 동적 삽입 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allItems = [];

        async function loadSpacData() {
            try {
                const response = await fetch('data/spacs.json');
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `최종 갱신: ${data.updated_at}`;
                allItems = data.items;

                updateRecommendations(allItems);
                applyFilters();

            } catch (error) {
                console.error('데이터 로드 에러:', error);
                document.getElementById('update-time').innerText = '데이터 로드 실패';
            }
        }

        function updateRecommendations(items) {
            const validItems = items.filter(i => i.is_fair_buy === 'O' && i.status === '정상');

            const mergerItems = validItems.filter(i => i.invest_type === '합병').sort((a, b) => b.yield_isa - a.yield_isa);
            if (mergerItems.length > 0) {
                const bestM = mergerItems[0];
                document.getElementById('rec-merger-name').innerText = bestM.name;
                document.getElementById('rec-merger-price').innerText = bestM.current_price.toLocaleString() + '원';
                document.getElementById('rec-merger-yield').innerText = bestM.yield_isa + '%';
                document.getElementById('rec-merger-liq').innerText = bestM.liquidation_price.toLocaleString() + '원';
            } else {
                document.getElementById('rec-merger-name').innerText = '조건 만족 종목 없음';
            }

            const liqItems = validItems.filter(i => i.invest_type === '청산').sort((a, b) => b.yield_isa - a.yield_isa);
            if (liqItems.length > 0) {
                const bestL = liqItems[0];
                document.getElementById('rec-liq-name').innerText = bestL.name;
                document.getElementById('rec-liq-price').innerText = bestL.current_price.toLocaleString() + '원';
                document.getElementById('rec-liq-yield').innerText = bestL.yield_isa + '%';
                document.getElementById('rec-liq-liq').innerText = bestL.liquidation_price.toLocaleString() + '원';
            } else {
                document.getElementById('rec-liq-name').innerText = '조건 만족 종목 없음';
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('spac-table-body');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-gray-400">조건에 일치하는 종목이 없습니다.</td></tr>`;
                return;
            }

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-900">${item.name}</td>
                    <td class="py-3 px-4">${item.current_price > 0 ? item.current_price.toLocaleString() + '원' : '-'}</td>
                    <td class="py-3 px-4 text-gray-600">${item.liquidation_price.toLocaleString()}원</td>
                    <td class="py-3 px-4 font-bold ${item.is_fair_buy === 'O' ? 'text-blue-600' : 'text-gray-400'}">${item.is_fair_buy}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 text-xs rounded-full ${item.invest_type === '합병' ? 'bg-purple-50 text-purple-700' : 'bg-amber-50 text-amber-700'}">${item.invest_type}</span></td>
                    <td class="py-3 px-4 font-semibold text-gray-700">${item.yield_general}%</td>
                    <td class="py-3 px-4 font-semibold text-emerald-600">${item.yield_isa}%</td>
                    <td class="py-3 px-4 text-xs ${item.status === '거래정지' ? 'text-red-500 font-bold' : 'text-gray-500'}">${item.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filter-type').value;
            const fairFilter = document.getElementById('filter-fair').value;
            const statusFilter = document.getElementById('filter-status').value;
            const yieldType = document.getElementById('filter-yield-type').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            let filtered = allItems.filter(item => {
                if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
                if (typeFilter !== 'all' && item.invest_type !== typeFilter) return false;
                if (fairFilter !== 'all' && item.is_fair_buy !== fairFilter) return false;
                if (statusFilter !== 'all' && item.status !== statusFilter) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (yieldType === 'general') return b.yield_general - a.yield_general;
                return b.yield_isa - a.yield_isa; // 'all' 이나 'isa'인 경우 기본 ISA 기준 정렬
            });

            renderTable(filtered);
        }

        loadSpacData();
    </script>
</body>
</html>
