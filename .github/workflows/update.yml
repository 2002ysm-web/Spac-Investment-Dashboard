name: update-spac-data

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nested folder structure
        run: |
          if [ -d "Spac-Investment-Dashboard" ]; then
            cp -r Spac-Investment-Dashboard/* .
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/update_data.py --check
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      - run: python scripts/update_data.py -v
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_COOKIE: ${{ secrets.KRX_COOKIE }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      - run: |
          git config user.name "spac-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/spacs.json && (git diff --cached --quiet || git commit -m "data: auto update" && git push)
