name: update-spac-data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests pandas
      - name: Run update script
        run: python build_seed.py check auto
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      - name: Commit and push changes
        run: |
          git config user.name "spac-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/spacs.json
          git diff --cached --quiet || (git commit -m "data: auto update" && git push)
