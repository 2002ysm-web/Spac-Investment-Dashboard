name: update-spac-data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml

      - name: Run update script & direct push via API
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. 스크립트 실행하여 data/spacs.json 생성
          python build_new.py check auto
          
          # 2. git 충돌 방지를 위해 API(또는 간단한 설정)로 안전하게 반영
          git config user.name "spac-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/spacs.json
          git commit -m "data: auto update" || echo "No changes"
          
          # 원격 강제 푸시 대신 rebase 후 푸시 또는 실패 시 분기 처리
          git push https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git HEAD:main --force
